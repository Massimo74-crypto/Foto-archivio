plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'it.fa.fotoarchivio'
    compileSdk 35

    defaultConfig {
        applicationId 'it.fa.fotoarchivio'
        minSdk 29
        targetSdk 35
        versionCode 15
        versionName '0.6.1'
    }

    signingConfigs {
        release {
            def signingStore = System.getenv("FA_KEYSTORE_PATH")
            def signingPassword = System.getenv("FA_KEYSTORE_PASSWORD")
            if (signingStore && signingPassword) {
                storeFile file(signingStore)
                storeType "PKCS12"
                storePassword signingPassword
                keyAlias "fotoarchivio-release"
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
