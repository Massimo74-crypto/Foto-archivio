name: Build SAS Rapportino APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SAS-Rapportino-Android/SAS_Rapportino_Android.zip'
      - '.github/workflows/build-sas-rapportino.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract Android project
        run: |
          mkdir -p sas-project
          unzip -q SAS-Rapportino-Android/SAS_Rapportino_Android.zip -d sas-project
          SETTINGS_FILE="$(find sas-project -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle non trovato nell'archivio"
            find sas-project -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Build debug APK
        run: gradle --no-daemon -p "$ANDROID_PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAS-Rapportino-debug
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
