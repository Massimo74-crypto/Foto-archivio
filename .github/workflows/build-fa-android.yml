name: Build FA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FA-Android/**'
      - '.github/workflows/build-fa-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install original vintage images
        run: |
          mkdir -p FA-Android/app/src/main/res/drawable-nodpi
          # Open album: used inside the app as the archive illustration
          curl -L --fail --silent --show-error "https://raw.githubusercontent.com/Massimo74-crypto/Foto-archivio/main/file_00000000c53882108ed52dd93d0cc7bb.png" -o FA-Android/app/src/main/res/drawable-nodpi/fa_vintage_watermark_image.png
          # Closed album: used only as the Android app icon
          curl -L --fail --silent --show-error "https://raw.githubusercontent.com/Massimo74-crypto/Foto-archivio/main/file_00000000e4f48210a4714c7586aa9c2f.png" -o FA-Android/app/src/main/res/drawable-nodpi/fa_launcher_icon_image.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p FA-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FA-Foto-Archivio-debug
          path: FA-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android source
        uses: actions/upload-artifact@v4
        with:
          name: FA-Android-source
          path: FA-Android/
          if-no-files-found: error
          retention-days: 30
