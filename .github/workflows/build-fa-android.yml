name: Build FA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FA-Android/**'
      - '.github/workflows/build-fa-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify permanent signing secrets
        env:
          FA_KEYSTORE_BASE64: ${{ secrets.FA_KEYSTORE_BASE64 }}
          FA_KEYSTORE_PASSWORD: ${{ secrets.FA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$FA_KEYSTORE_BASE64" || (echo "Missing FA_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$FA_KEYSTORE_PASSWORD" || (echo "Missing FA_KEYSTORE_PASSWORD repository secret" && exit 1)
          echo "$FA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fa-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/fa-release.p12" -storetype PKCS12 -storepass "$FA_KEYSTORE_PASSWORD" -alias fotoarchivio-release
          echo "FA_KEYSTORE_PATH=$RUNNER_TEMP/fa-release.p12" >> "$GITHUB_ENV"

      - name: Install original vintage home image
        run: |
          mkdir -p FA-Android/app/src/main/res/drawable-nodpi
          curl -L --fail --silent --show-error "https://raw.githubusercontent.com/Massimo74-crypto/Foto-archivio/main/file_00000000c53882108ed52dd93d0cc7bb.png" -o FA-Android/app/src/main/res/drawable-nodpi/fa_home_image.png

      - name: Install separate vintage movie camera overlay
        run: |
          mkdir -p FA-Android/app/src/main/res/drawable-nodpi
          base64 --decode .github/assets/fa_vintage_movie_camera.webp.b64 > FA-Android/app/src/main/res/drawable-nodpi/fa_vintage_movie_camera.webp
          python3 - <<'PY'
          from pathlib import Path
          import struct
          image = Path("FA-Android/app/src/main/res/drawable-nodpi/fa_vintage_movie_camera.webp").read_bytes()
          assert image[:4] == b"RIFF" and image[8:12] == b"WEBP", "Invalid WebP header"
          assert struct.unpack("<I", image[4:8])[0] + 8 == len(image), "WebP length mismatch"
          print(f"Vintage camera WebP verified: {len(image)} bytes")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        env:
          FA_KEYSTORE_PASSWORD: ${{ secrets.FA_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon -p FA-Android assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs FA-Android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FA-Foto-Archivio-0.6.0-signed
          path: FA-Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android source
        uses: actions/upload-artifact@v4
        with:
          name: FA-Android-source
          path: FA-Android/
          if-no-files-found: error
          retention-days: 30
